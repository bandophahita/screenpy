name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Get pip cache dir
        id: pip-cache
        run: |
          python -m ensurepip --upgrade
          echo "::set-output name=dir::$(pip cache dir)"
      - name: Cache pip
        uses: actions/cache@v2
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ matrix.os }}-pip-${{ matrix.python-version }}-v1-${{
            hashFiles('**/setup.py', '**/requirements*.txt') }}
          restore-keys: |
            ${{ matrix.os }}-pip-${{ matrix.python-version }}-v1-
      # black SHOULD be added to the setup.py extras.. 
      # but for now we'll manually install it here
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install black
          pip install isort
          pip install flake8
          pip install mypy
      - name: Lint with black
        run: |
          black --check --diff screenpy
      - name: Lint with isort
        run: |
          isort --check-only --diff screenpy
      - name: Lint with flake8
        run: |
          flake8 --exit-zero screenpy
      - name: Lint with mypy
        run: |
          mypy screenpy
